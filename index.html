<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#165b92">
  <title>SDG Record</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>入力</h1>

      <form id="recordForm">
        <input type="hidden" id="editId">

        <label>
          測定日
          <input id="date" type="date" required>
        </label>

        <div class="two-column">
          <label>
            測点
            <select id="point" required></select>
          </label>

          <label>
            車線
            <select id="lane" required>
              <option value="左">左</option>
              <option value="右">右</option>
            </select>
          </label>
        </div>

        <label>
          乾燥密度（kg/m³）
          <input
            id="density"
            type="number"
            inputmode="decimal"
            min="0"
            step="0.1"
            placeholder="例：1931.7"
            required
          >
        </label>

        <button id="saveButton" type="submit" class="primary wide">登録</button>
        <button id="cancelEditButton" type="button" class="secondary wide hidden">編集をやめる</button>
      </form>
    </section>

    <section class="card">
      <div class="heading-row">
        <h2>記録一覧</h2>
        <strong id="recordCount">0件</strong>
      </div>

      <div class="filter-row">
        <button id="showTodayButton" type="button" class="filter active">今日</button>
        <button id="showAllButton" type="button" class="filter">全件</button>
      </div>

      <p id="emptyMessage" class="empty-message">記録はありません。</p>
      <div id="recordList" class="record-list"></div>
    </section>

    <section class="card">
      <h2>CSV共有・メール</h2>
      <p class="note">共有画面が開いたらOutlookを選択して送信してください。</p>

      <button id="shareCsvButton" type="button" class="primary wide">
        CSVを共有・メールする
      </button>

      <button id="deleteAllButton" type="button" class="danger-outline wide">
        全データ削除
      </button>
    </section>

    <p class="footer-note">測定データはこの端末内に保存され、GitHubには送信されません。</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
