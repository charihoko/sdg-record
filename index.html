<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5d66">
  <title>SDG Record</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>SDG Record</h1>
      <p>乾燥密度 記録</p>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>測定値を入力</h2>

      <form id="recordForm">
        <input type="hidden" id="editId">

        <label>
          測定日
          <input id="date" type="date" required>
        </label>

        <label>
          測点
          <select id="point" required></select>
        </label>

        <fieldset>
          <legend>車線</legend>
          <div class="lane-buttons">
            <label class="radio-button">
              <input type="radio" name="lane" value="左" checked>
              <span>左</span>
            </label>
            <label class="radio-button">
              <input type="radio" name="lane" value="右">
              <span>右</span>
            </label>
          </div>
        </fieldset>

        <label>
          乾燥密度（kg/m³）
          <input
            id="density"
            type="number"
            inputmode="decimal"
            min="0"
            step="0.1"
            placeholder="例：1931.7"
            required
          >
        </label>

        <div class="form-actions">
          <button id="saveButton" type="submit" class="primary">登録する</button>
          <button id="cancelEditButton" type="button" class="secondary hidden">編集をやめる</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="section-heading">
        <h2>測定記録</h2>
        <div class="filter-buttons">
          <button id="showTodayButton" type="button" class="small active">今日</button>
          <button id="showAllButton" type="button" class="small">全件</button>
        </div>
      </div>

      <p id="emptyMessage" class="empty-message">記録はありません。</p>
      <div id="recordList" class="record-list"></div>
    </section>

    <section class="card">
      <h2>CSV</h2>
      <button id="shareCsvButton" type="button" class="primary wide">
        CSVを共有・メールする
      </button>
      <p class="note">共有画面が開いたらOutlookを選択してください。</p>
    </section>

    <section class="card danger-card">
      <h2>データ管理</h2>
      <button id="deleteAllButton" type="button" class="danger wide">
        全データ削除
      </button>
      <p class="note">全削除は2回確認してから実行します。</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
