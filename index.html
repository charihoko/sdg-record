<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#165b92">
  <title>SDG Record V1.5.3</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=1.5.3">
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>入力</h1>

      <div class="reference-values" aria-label="締固め管理の固定値">
        <div><span>最大乾燥密度</span><strong>1803 kg/m³</strong></div>
        <div><span>最適含水比</span><strong>12.4 %</strong></div>
        <p>含水比はSDG画面で確認（記録には保存しません）</p>
      </div>

      <form id="recordForm">
        <input type="hidden" id="editId">

        <label>
          測定日
          <input id="date" type="date" required>
        </label>

        <div class="two-column">
          <label>
            測点
            <select id="point" required></select>
          </label>

          <label>
            車線
            <select id="lane" required>
              <option value="左">左</option>
              <option value="右">右</option>
            </select>
          </label>
        </div>

        <label>
          乾燥密度（kg/m³）
          <input
            id="density"
            type="number"
            inputmode="decimal"
            min="0"
            step="0.1"
            placeholder="例：1931.7"
            required
          >
        </label>

        <button id="saveButton" type="submit" class="primary wide">登録</button>
        <button id="cancelEditButton" type="button" class="secondary wide hidden">編集をやめる</button>
      </form>
    </section>

    <section class="card">
      <div class="heading-row">
        <h2>記録一覧</h2>
        <strong id="recordCount">0件</strong>
      </div>

      <div class="filter-row">
        <button id="showTodayButton" type="button" class="filter active">今日</button>
        <button id="showAllButton" type="button" class="filter">全件</button>
        <button id="showGraphButton" type="button" class="filter graph-button">グラフ</button>
      </div>

      <p id="emptyMessage" class="empty-message">記録はありません。</p>
      <div id="recordList" class="record-list"></div>
    </section>

    <section id="graphSection" class="card hidden">
      <div class="heading-row">
        <h2>締固め度グラフ</h2>
        <button id="closeGraphButton" type="button" class="secondary compact">閉じる</button>
      </div>
      <p id="graphScope" class="note graph-scope"></p>
      <section class="chart-panel">
        <h3>左測点</h3>
        <div id="leftStats" class="chart-stats"></div>
        <div class="chart-scroll"><canvas id="leftChart" height="280"></canvas></div>
        <p id="leftEmpty" class="empty-message hidden">左測点の記録はありません。</p>
      </section>
      <section class="chart-panel">
        <h3>右測点</h3>
        <div id="rightStats" class="chart-stats"></div>
        <div class="chart-scroll"><canvas id="rightChart" height="280"></canvas></div>
        <p id="rightEmpty" class="empty-message hidden">右測点の記録はありません。</p>
      </section>
      <p class="chart-legend"><span class="legend-93"></span>93%基準　<span class="legend-100"></span>100%基準</p>
    </section>

    <section class="card">
      <h2>CSV共有・メール</h2>
      <p class="note">共有画面が開いたらOutlookを選択して送信してください。</p>

      <button id="shareCsvButton" type="button" class="primary wide">
        CSVを共有・メールする
      </button>

      <div class="import-area">
        <h3>CSVを取り込む</h3>
        <p class="note">V1.4・V1.5のCSVに対応。既存記録は削除・上書きしません。</p>
        <input id="csvFileInput" class="file-input" type="file" accept=".csv,text/csv">
        <button id="selectCsvButton" type="button" class="secondary wide">CSVファイルを選ぶ</button>
      </div>

      <button id="deleteAllButton" type="button" class="danger-outline wide">
        全データ削除
      </button>
    </section>

    <p class="footer-note">測定データはこの端末内に保存され、GitHubには送信されません。</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="importDialog" class="import-dialog">
    <h2>CSV取込確認</h2>
    <p id="importFileName" class="import-file-name"></p>
    <div class="import-summary">
      <div><span>読込件数</span><strong id="importTotal">0件</strong></div>
      <div><span>追加</span><strong id="importAdd">0件</strong></div>
      <div><span>重複</span><strong id="importDuplicate">0件</strong></div>
    </div>
    <p id="importWarning" class="import-warning hidden"></p>
    <div class="dialog-actions">
      <button id="cancelImportButton" type="button" class="secondary">キャンセル</button>
      <button id="confirmImportButton" type="button" class="primary">追加する</button>
    </div>
  </dialog>
  <script src="app-v1.5.2.js?v=1.5.3"></script>
</body>
</html>
