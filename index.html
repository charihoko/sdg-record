<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f4c81" />
  <title>SDG Record</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>SDG Record</h1>
      <p>乾燥密度 記録</p>
    </div>
    <span class="badge">V1.0</span>
  </header>

  <main>
    <section class="card">
      <h2>入力</h2>

      <label>
        測定日
        <input id="measurementDate" type="date" />
      </label>

      <div class="grid-2">
        <label>
          測点
          <select id="point"></select>
        </label>

        <label>
          車線
          <select id="lane">
            <option value="左">左</option>
            <option value="右">右</option>
          </select>
        </label>
      </div>

      <div class="ocr-box">
        <label class="photo-button">
          📷 SDG画面を撮影・選択
          <input id="photoInput" type="file" accept="image/*" capture="environment" />
        </label>
        <img id="preview" alt="撮影画像の確認" hidden />
        <button id="ocrButton" class="secondary" type="button" disabled>画像から乾燥密度を読み取る</button>
        <div id="ocrStatus" class="status">画像は保存されません。</div>
      </div>

      <label>
        乾燥密度（kg/m³）
        <input
          id="density"
          type="number"
          inputmode="decimal"
          min="1000"
          max="3000"
          step="0.1"
          placeholder="例：1931.7"
        />
      </label>

      <div class="button-row">
        <button id="saveButton" class="primary" type="button">登録</button>
        <button id="cancelEditButton" class="ghost" type="button" hidden>編集を取消</button>
      </div>
      <p id="message" class="message" aria-live="polite"></p>
    </section>

    <section class="card">
      <div class="section-title-row">
        <h2>記録一覧</h2>
        <span id="recordCount" class="record-count">0件</span>
      </div>

      <div class="filter-row">
        <button id="showTodayButton" class="small active" type="button">今日</button>
        <button id="showAllButton" class="small" type="button">全件</button>
      </div>

      <div id="emptyState" class="empty-state">記録はありません。</div>
      <div id="recordList" class="record-list"></div>
    </section>

    <section class="card">
      <h2>CSV出力</h2>
      <p class="help">CSVを出力し、iPhoneの共有メニューからOneDriveの「口屋内TN／SDG」へ保存してください。</p>
      <div class="button-row stack-mobile">
        <button id="exportButton" class="primary" type="button">CSVを出力</button>
        <button id="backupButton" class="secondary" type="button">バックアップ保存</button>
        <label class="secondary file-label">
          バックアップ読込
          <input id="restoreInput" type="file" accept=".json,application/json" />
        </label>
      </div>
      <button id="deleteAllButton" class="danger-outline" type="button">全データ削除</button>
    </section>
  </main>

  <footer>
    <p>測定データはこの端末内に保存され、GitHubには送信されません。</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
